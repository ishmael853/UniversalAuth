[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-auth"
version = "0.1.0"
description = "A reusable Python authentication and user management library."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "UniversalAuth Contributors" }
]

dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "argon2-cffi>=23.1,<26.0"
]

[tool.setuptools.packages.find]
include = ["universal_auth*"]